name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Patch telephony plugin
        run: |
          # Use find to locate the telephony build.gradle file
          TELEPHONY_GRADLE=$(find ~/.pub-cache/hosted/pub.dev/ -path "*/telephony-*/android/build.gradle" | head -n 1)
          if [ -f "$TELEPHONY_GRADLE" ]; then
            echo "Patching $TELEPHONY_GRADLE"
            # Add kotlinOptions { jvmTarget = '11' } to the end of the file
            echo "" >> "$TELEPHONY_GRADLE"
            echo "kotlinOptions { jvmTarget = '11' }" >> "$TELEPHONY_GRADLE"
          else
            echo "telephony build.gradle not found"
          fi
        shell: bash
      - name: Build APK
        working-directory: ./frontend
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: care-alert-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
