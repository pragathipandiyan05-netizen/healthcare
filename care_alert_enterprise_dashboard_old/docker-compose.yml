version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: care_alert_postgres
    environment:
      POSTGRES_DB: care_alert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: care_alert_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
