version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: care_alert_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: care_alert
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: care_alert_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: 
      context: ./care_alert_enterprise_dashboard_old/backend
    container_name: care_alert_backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  admin-portal:
    build: 
      context: ./frontend/admin_portal
    container_name: care_alert_admin_portal
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
